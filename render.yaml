services:
  - type: web
    name: ai-media-studio
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-media-studio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_VIDEO_MODEL
        value: Wan-AI/Wan2.2-TI2V-5B
      - key: HF_VIDEO_PROVIDER
        value: auto
      - key: HF_VIDEO_FALLBACK_MODEL
        value: tencent/HunyuanVideo
      - key: HF_VIDEO_FALLBACK_PROVIDER
        value: auto
      - key: VIDRUSH_API_KEY
        sync: false
      - key: VIDRUSH_API_BASE
        value: https://vidrush-ai.com/api/v1
      - key: VIDEO_PROVIDER
        value: vidrush
      - key: VIDEO_PROVIDER_FALLBACK
        value: replicate
      - key: VIDRUSH_VIDEO_MODEL
        value: vidrush-v1
      - key: VIDRUSH_VIDEO_DURATION
        value: 8s
      - key: VIDRUSH_VIDEO_RESOLUTION
        value: 720p
      - key: VIDRUSH_VIDEO_ASPECT_RATIO
        value: 16:9
      - key: VIDRUSH_POLL_SECONDS
        value: "5"
      - key: VIDRUSH_MAX_POLLS
        value: "120"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: APP_URL
        value: https://ai-media-studio-edt4.onrender.com
      - key: VIDEO_ASPECT_RATIO
        value: 16:9
      - key: VIDEO_SECONDS
        value: "5"

databases:
  - name: ai-media-studio-db
    databaseName: ai_media_studio
    plan: free
